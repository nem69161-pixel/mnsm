<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>POV: She wants flower</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #040105;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      color: #fff;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .bg-container {
      position: fixed;
      inset: 0;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #040105;
      overflow: hidden;
    }

    .bg-image {
      width: 100%;
      max-width: 650px;
      height: auto;
      max-height: 70vh;
      object-fit: cover;
      filter: brightness(0.6) contrast(0.92) saturate(0.85);
      mask-image: radial-gradient(circle, rgba(0,0,0,1) 45%, rgba(0,0,0,0) 100%);
      -webkit-mask-image: radial-gradient(circle, rgba(0,0,0,1) 45%, rgba(0,0,0,0) 100%);
      border-radius: 24px;
    }

    .overlay-shadow {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background: linear-gradient(to bottom, 
        rgba(4, 1, 5, 0.92) 0%, 
        rgba(4, 1, 5, 0) 25%, 
        rgba(4, 1, 5, 0) 75%, 
        rgba(4, 1, 5, 0.95) 100%);
    }

    .stars-container {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }

    .star {
      position: absolute;
      background: #fff;
      border-radius: 50%;
      opacity: 0.3;
      animation: twinkle linear infinite;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.1; transform: scale(0.8); }
      50% { opacity: 0.8; transform: scale(1.4); }
    }

    .interactive-layer {
      position: fixed;
      inset: 0;
      z-index: 4;
      pointer-events: none;
      overflow: hidden;
    }

    .floating-text {
      position: absolute;
      color: #ffb6c1;
      font-size: 15px;
      font-weight: 600;
      text-shadow: 0 0 8px rgba(255, 105, 180, 0.8);
      animation: floatUp 2.2s ease-out forwards;
      white-space: nowrap;
    }

    @keyframes floatUp {
      0% { opacity: 0; transform: translateY(0) scale(0.7); }
      20% { opacity: 1; transform: translateY(-15px) scale(1.05); }
      100% { opacity: 0; transform: translateY(-60px) scale(0.9); }
    }

    .trail-heart {
      position: absolute;
      color: #ff4d6d;
      font-size: 14px;
      pointer-events: none;
      animation: fadeTrail 1s ease-out forwards;
    }

    @keyframes fadeTrail {
      0% { opacity: 0.9; transform: scale(1) translateY(0); }
      100% { opacity: 0; transform: scale(0.3) translateY(25px); }
    }

    #scene {
      position: fixed;
      inset: 0;
      z-index: 3;
      display: block;
      width: 100vw;
      height: 100vh;
      cursor: crosshair;
      touch-action: none;
    }

    .ui {
      position: fixed;
      top: 24px;
      left: 0;
      right: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
      z-index: 10;
      text-shadow: 0 0 12px rgba(0, 0, 0, 0.9), 0 2px 20px rgba(0, 0, 0, 1);
      user-select: none;
    }

    .ui h1 {
      font-size: clamp(20px, 3vw, 30px);
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .ui p {
      margin-top: 6px;
      font-size: clamp(11px, 1.3vw, 14px);
      color: rgba(255, 210, 225, 0.95);
      font-style: italic;
    }

    .audio-control {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 20;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #fff;
      padding: 10px 18px;
      border-radius: 30px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .audio-control:hover {
      background: rgba(0, 0, 0, 0.75);
      transform: scale(1.05);
    }

    .fallback {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      color: #fff;
      font-family: sans-serif;
      background: #040105;
      z-index: 100;
    }
  </style>
</head>
<body>

  <div class="bg-container">
    <img src="https://i.ibb.co/chfWdbkM/photo-5307690382646778980-y-1.jpg" alt="Eyes" class="bg-image" />
  </div>

  <div class="overlay-shadow"></div>
  <div class="stars-container" id="stars"></div>
  <div class="interactive-layer" id="interactiveLayer"></div>

  <canvas id="scene"></canvas>

  <div class="ui">
    <h1>POV: She wants flower</h1>
    <p>🌸 حرك الماوس أو انقر لزراعة الورود والقلوب 💖</p>
  </div>

  <button id="audioBtn" class="audio-control">🎵 تشغيل الموسيقى</button>

  <div id="fallback" class="fallback">
    <div>
      <h2 style="margin-bottom:12px">WebGL غير مدعوم</h2>
      <p style="color:#bbb">يرجى استخدام متصفح حديث يدعم التسريع البرمجي.</p>
    </div>
  </div>

  <script>
  'use strict';

  /* =========================================================================
   * 1. النجوم
   * ========================================================================= */
  const starsContainer = document.getElementById('stars');
  const STAR_COUNT = 55;

  for (let i = 0; i < STAR_COUNT; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    const size = Math.random() * 2.5 + 1 + 'px';
    star.style.width = size;
    star.style.height = size;
    star.style.top = Math.random() * 100 + '%';
    star.style.left = Math.random() * 100 + '%';
    star.style.animationDuration = (Math.random() * 3 + 2) + 's';
    star.style.animationDelay = (Math.random() * 3) + 's';
    starsContainer.appendChild(star);
  }

  /* =========================================================================
   * 2. الموسيقى المضافة برابطك المباشر
   * ========================================================================= */
  const audio = new Audio('https://files.catbox.moe/bwmnrj.mp3');
  const audioBtn = document.getElementById('audioBtn');
  audio.loop = true;

  audioBtn.addEventListener('click', () => {
    if (audio.paused) {
      audio.play().then(() => {
        audioBtn.textContent = '⏸️ إيقاف الموسيقى';
      }).catch(err => console.log('خطأ التشغيل:', err));
    } else {
      audio.pause();
      audioBtn.textContent = '🎵 تشغيل الموسيقى';
    }
  });

  /* =========================================================================
   * 3. التأثيرات التفاعلية
   * ========================================================================= */
  const interactiveLayer = document.getElementById('interactiveLayer');
  const loveTexts = ["💖", "✨", "🌸", "عُيونكِ", "جمالكِ", "💕", "حب", "🌷"];

  function spawnFloatingText(x, y) {
    const textEl = document.createElement('div');
    textEl.className = 'floating-text';
    textEl.style.left = x + 'px';
    textEl.style.top = y + 'px';
    textEl.textContent = loveTexts[Math.floor(Math.random() * loveTexts.length)];
    interactiveLayer.appendChild(textEl);
    setTimeout(() => textEl.remove(), 2200);
  }

  function spawnTrailHeart(x, y) {
    const heart = document.createElement('div');
    heart.className = 'trail-heart';
    heart.style.left = x + 'px';
    heart.style.top = y + 'px';
    heart.textContent = Math.random() > 0.5 ? '💖' : '✨';
    interactiveLayer.appendChild(heart);
    setTimeout(() => heart.remove(), 1000);
  }

  let lastTrailTime = 0;
  window.addEventListener('mousemove', (e) => {
    const now = Date.now();
    if (now - lastTrailTime > 60) {
      spawnTrailHeart(e.clientX, e.clientY);
      lastTrailTime = now;
    }
  });

  /* =========================================================================
   * 4. محرك WebGL (الورود والقلوب البارزة)
   * ========================================================================= */
  const canvas = document.getElementById('scene');
  const gl = canvas.getContext('webgl', {
    antialias: true,
    premultipliedAlpha: true,
    powerPreference: 'high-performance'
  });

  if (!gl) {
    document.getElementById('fallback').style.display = 'flex';
    throw new Error('WebGL not supported');
  }

  const VS = `
    attribute vec2 a_position;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
    }
  `;

  const FS = `
    precision highp float;

    uniform vec2  u_resolution;
    uniform float u_time;
    uniform int   u_flowerCount;
    uniform vec4  u_flowers[16];

    #define MAX_FLOWERS 16

    float sdCircle(vec2 p, vec2 c, float r) {
      return length(p - c) - r;
    }
    float sdSegment(vec2 p, vec2 a, vec2 b, float r) {
      vec2 pa = p - a;
      vec2 ba = b - a;
      float h = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0);
      return length(pa - ba * h) - r;
    }

    float sdHeart(vec2 p, float size) {
      p /= size;
      p.y += 0.35;
      p.x = abs(p.x);
      if (p.y + p.x > 1.0)
        return (length(p - vec2(0.25, 0.75)) - 0.35355) * size;
      return (max(p.x + p.y, p.x - p.y) - 1.0) * size * 0.7071;
    }

    float flowerSilhouette(float angle, float petalCount, float shape) {
      float sectoral = abs(sin(angle * petalCount * 0.5));
      float r = 0.55 + 0.45 * sectoral;
      if (shape > 0.5 && shape < 1.5)      r += sin(angle * 3.0) * 0.08;
      else if (shape > 1.5 && shape < 2.5) r = 0.5 + 0.45 * abs(cos(angle * 1.5));
      return r;
    }

    vec3 getItemColor(float t) {
      if (t < 0.8) return vec3(1.00, 0.15, 0.40);
      if (t < 1.8) return vec3(1.00, 0.35, 0.60);
      if (t < 2.8) return vec3(0.95, 0.20, 0.30);
      if (t < 3.8) return vec3(1.00, 0.55, 0.75);
      return              vec3(0.85, 0.35, 0.90);
    }

    vec4 renderFlower(vec2 frag, vec4 f, vec4 currentCol) {
      if (f.w < 0.001) return currentCol;

      float age  = clamp(f.w, 0.0, 1.0);
      float stemT= smoothstep(0.0, 0.8, age);
      float headT= smoothstep(0.15, 1.0, age);

      vec3 itemCol = getItemColor(f.z);
      float isHeart = (f.z < 2.5) ? 1.0 : 0.0; 

      float sway = sin(u_time * 1.3 + f.z * 1.6) * 0.012 * age;
      vec2 head = vec2(f.x + sway * u_resolution.x, f.y);
      vec2 ground = vec2(f.x, 0.0);

      vec2 stemEnd = mix(ground, head, stemT);
      vec2 mid = mix(ground, head, 0.5);
      mid.x += sin(u_time * 0.7 + f.z) * 12.0;

      float stemD = min(
        sdSegment(frag, ground, mid, 2.8),
        sdSegment(frag, mid, stemEnd, 2.8)
      );
      float stemMask = 1.0 - smoothstep(-0.8, 1.2, stemD);
      vec3 col = mix(currentCol.rgb, vec3(0.35, 0.68, 0.38), stemMask * age);
      float alpha = max(currentCol.a, stemMask);

      vec2 dir = normalize(stemEnd - ground + vec2(0.0001));
      vec2 perp = vec2(-dir.y, dir.x);
      for (int j = 1; j <= 2; j++) {
        float t = float(j) / 3.0;
        if (t > stemT) break;
        vec2 lp = mix(ground, mid, t);
        float side = (mod(float(j), 2.0) < 0.5) ? 1.0 : -1.0;
        lp += perp * 12.0 * side;
        float lD = sdCircle(frag, lp, 8.5);
        float lM = 1.0 - smoothstep(-0.5, 1.5, lD);
        col = mix(col, vec3(0.40, 0.75, 0.45), lM * headT);
        alpha = max(alpha, lM * headT);
      }

      if (headT > 0.0) {
        vec2 q = frag - head;
        float d = 0.0;

        if (isHeart > 0.5) {
          float heartSize = 25.0 * headT; 
          d = sdHeart(q, heartSize);
        } else {
          float size = 0.095 * headT * u_resolution.y * 0.5;
          float a = atan(q.y, q.x) + u_time * 0.15 + f.z;
          float r = length(q);
          float silhouette = size * flowerSilhouette(a, 6.0, 0.0);
          d = r - silhouette;
        }

        float glowD = length(q);
        float glow  = exp(-glowD * 0.02) * 0.4 * headT;
        col += itemCol * glow;

        float headMask = 1.0 - smoothstep(-0.8, 0.8, d);
        col = mix(col, itemCol, headMask);
        alpha = max(alpha, headMask);

        float outline = smoothstep(-2.2, -0.2, d) - smoothstep(-0.2, 1.2, d);
        col = mix(col, vec3(1.0, 0.9, 0.95), outline * 0.5);

        if (isHeart < 0.5) {
          float centerD = length(q);
          float centerMask = 1.0 - smoothstep(3.0, 8.0, centerD);
          col = mix(col, vec3(1.0, 0.85, 0.4), centerMask * headT);
        }
      }

      return vec4(col, alpha);
    }

    void main() {
      vec2 frag = gl_FragCoord.xy;
      vec4 finalCol = vec4(0.0); 

      for (int i = 0; i < MAX_FLOWERS; i++) {
        if (i >= u_flowerCount) break;
        finalCol = renderFlower(frag, u_flowers[i], finalCol);
      }

      gl_FragColor = finalCol;
    }
  `;

  function compile(type, src) {
    const sh = gl.createShader(type);
    gl.shaderSource(sh, src);
    gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
      throw new Error('Shader compile failed: ' + gl.getShaderInfoLog(sh));
    }
    return sh;
  }

  function link(vs, fs) {
    const p = gl.createProgram();
    gl.attachShader(p, vs);
    gl.attachShader(p, fs);
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
      throw new Error('Program link failed: ' + gl.getProgramInfoLog(p));
    }
    return p;
  }

  const program = link(compile(gl.VERTEX_SHADER, VS), compile(gl.FRAGMENT_SHADER, FS));
  gl.useProgram(program);

  const quad = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, quad);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const aPos = gl.getAttribLocation(program, 'a_position');
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

  const uResolution = gl.getUniformLocation(program, 'u_resolution');
  const uTime       = gl.getUniformLocation(program, 'u_time');
  const uFlowerCount= gl.getUniformLocation(program, 'u_flowerCount');
  const uFlowers    = gl.getUniformLocation(program, 'u_flowers');

  let W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.floor(window.innerWidth  * DPR);
    H = Math.floor(window.innerHeight * DPR);
    canvas.width  = W;
    canvas.height = H;
    canvas.style.width  = window.innerWidth  + 'px';
    canvas.style.height = window.innerHeight + 'px';
    gl.viewport(0, 0, W, H);
  }
  window.addEventListener('resize', resize, { passive: true });
  resize();

  const MAX_FLOWERS = 16;
  const flowers = [];

  flowers.push({
    normX: 0.5,
    normY: 0.55,
    type: 0,
    plantedAt: performance.now() - 600
  });

  function plantAt(cssX, cssY) {
    if (flowers.length >= MAX_FLOWERS) flowers.pop();
    flowers.unshift({
      normX: cssX / window.innerWidth,
      normY: (window.innerHeight - cssY) / window.innerHeight,
      type: flowers.length % 5,
      plantedAt: performance.now()
    });
    spawnFloatingText(cssX, cssY - 20);
  }
  let isTouchActive = false;
  canvas.addEventListener('click', (e) => {
    if (isTouchActive) { isTouchActive = false; return; }
    plantAt(e.clientX, e.clientY);
  });

  canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    isTouchActive = true;
    for (const t of e.touches) plantAt(t.clientX, t.clientY);
  }, { passive: false });

  const GROW_MS = 1200;
  const start = performance.now();
  const flowerBuf = new Float32Array(MAX_FLOWERS * 4);

  function frame(now) {
    const t = (now - start) / 1000;

    for (let i = 0; i < flowers.length && i < MAX_FLOWERS; i++) {
      const f = flowers[i];
      const age = Math.min(1, Math.max(0, (now - f.plantedAt) / GROW_MS));
      flowerBuf[i * 4 + 0] = f.normX * W;
      flowerBuf[i * 4 + 1] = f.normY * H;
      flowerBuf[i * 4 + 2] = f.type;
      flowerBuf[i * 4 + 3] = age;
    }

    gl.uniform2f(uResolution, W, H);
    gl.uniform1f(uTime, t);
    gl.uniform1i(uFlowerCount, Math.min(flowers.length, MAX_FLOWERS));
    gl.uniform4fv(uFlowers, flowerBuf);

    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  </script>
</body>
</html>
